# Deploy Flutter web on Render via Dockerfile (multi-stage build + nginx).
#
# Image: ghcr.io/gmeligio/flutter-web:3.44.8 (Dart 3.12 / Flutter 3.44)
# Matches pubspec `sdk: ^3.12.2` and `flutter: ">=3.44.0"`.
services:
  - type: web
    name: garden-town-county
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
